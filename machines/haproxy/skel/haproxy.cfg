global
	log /dev/log	local0
	log /dev/log	local1 notice
	stats socket /tmp/admin.sock mode 660 level admin
	stats timeout 30s
	user haproxy
	group haproxy
	daemon
	maxconn 200000
	# Default SSL material locations
	ca-base /etc/ssl/certs
	crt-base /etc/ssl/private
	# See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.8&config=intermediate
	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
	ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
	# Performance: tune SSL caches and buffer size
	tune.ssl.default-dh-param 2048
	tune.bufsize 32768

defaults
	log	global
	mode	http
	option	httplog
	option	dontlognull
	option	http-server-close
	timeout connect 5s
	timeout client  30s
	timeout server  30s
	timeout tunnel  3600s
	timeout http-keep-alive 60s
	timeout http-request 10s
	timeout queue 30s
	errorfile 400 /etc/haproxy/errors/400.http
	errorfile 403 /etc/haproxy/errors/403.http
	errorfile 408 /etc/haproxy/errors/408.http
	errorfile 429 /etc/haproxy/errors/429.http
	errorfile 500 /etc/haproxy/errors/500.http
	errorfile 502 /etc/haproxy/errors/502.http
	errorfile 503 /etc/haproxy/errors/503.http
	errorfile 504 /etc/haproxy/errors/504.http

# --- Rate limiting stick-table ---
backend rate_limit_tracking
	stick-table type ip size 200k expire 30s store http_req_rate(10s),conn_cur

# --- HTTP -> HTTPS redirect ---
frontend http
	bind 0.0.0.0:80
	mode http
	# Allow ACME challenges for certbot renewal
	acl is_acme path_beg /.well-known/acme-challenge/
	http-request redirect scheme https code 301 unless is_acme
	# Serve ACME challenges directly (certbot standalone uses port 80)
	default_backend acme_backend

backend acme_backend
	mode http
	server acme 127.0.0.1:8080

# --- Main HTTPS frontend ---
frontend secured
	bind 0.0.0.0:443 ssl crt /etc/haproxy/certs/bundle.pem alpn h2,http/1.1

	mode			http
	timeout			client 3600s
	backlog			8192
	maxconn			200000
	default_backend		main

	# --- CoinOS external API proxy ---
	# Allows remote servers (e.g. ribbit.network) to reach this server's CoinOS
	# Requires x-api-key header; rejects unauthenticated requests
	acl is_coinos path_beg /coinos
	acl has_api_key req.hdr(x-api-key) -m found
	http-request deny deny_status 403 if is_coinos !has_api_key
	http-request set-path %[path,regsub(^/coinos,,)] if is_coinos
	use_backend coinos if is_coinos

	# --- Ribbit frontend routing (when ribbit container is active) ---
	# API, admin panel, and well-known routes go to relaycreator backend
	acl is_api path_beg /api
	acl is_wellknown path_beg /.well-known
	acl is_admin path_beg /admin
	# Use ribbit backend for everything else if it's available
	use_backend ribbit if !is_api !is_wellknown !is_admin { srv_is_up(ribbit/ribbit-001) }

	# Security headers
	http-request del-header x-real-ip
	option forwardfor except 127.0.0.1 header x-real-ip
	http-response set-header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
	http-response set-header X-Content-Type-Options "nosniff"
	http-response set-header X-Frame-Options "SAMEORIGIN"

	# Rate limiting: track client IPs and reject abusive ones
	http-request track-sc0 src table rate_limit_tracking
	# Deny if >100 requests in 10 seconds from same IP
	http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
	# Deny if >50 concurrent connections from same IP
	http-request deny deny_status 429 if { sc_conn_cur(0) gt 50 }

# --- Stats dashboard ---
frontend stats
	bind 0.0.0.0:8404
	mode http
	stats enable
	stats uri /stats
	stats refresh 10s
	stats show-legends
	stats auth haproxy:haproxy

# --- Main backend (relaycreator API + admin) ---
backend main
	mode		http
	option		redispatch
	balance		source
	option forwardfor except 127.0.0.1 header x-real-ip
	# Health checks: check every 5s, mark down after 3 failures, up after 2 successes
	server main-001 127.0.0.1:4000 maxconn 100000 weight 10 check inter 5s fall 3 rise 2

# --- Ribbit frontend backend (Bun/Hono on port 3000) ---
# Only active when the ribbit container is running; HAProxy gracefully
# falls back to the main backend if this server is down.
backend ribbit
	mode		http
	option		redispatch
	balance		source
	option forwardfor except 127.0.0.1 header x-real-ip
	server ribbit-001 127.0.0.1:3000 maxconn 100000 weight 10 check inter 5s fall 3 rise 2

# --- CoinOS backend (coinos-server on port 3119) ---
# Exposed at /coinos/* for remote API access. x-api-key required by frontend ACL.
backend coinos
	mode		http
	option forwardfor except 127.0.0.1 header x-real-ip
	server coinos-001 127.0.0.1:3119 maxconn 10000 weight 10 check inter 10s fall 3 rise 2
