# Ergo IRC server config for mycelium.social
# Hyphae connects via plaintext on loopback (127.0.0.1:6667)
# No public TLS listener needed — HAProxy terminates TLS for WebSocket clients

network:
    name: Mycelium

server:
    name: chat.mycelium.social

    listeners:
        # Plaintext on loopback only — hyphae bridge connects here
        "127.0.0.1:6667":
        "[::1]:6667":

        # No public TLS listener — hyphae proxies all client connections

    # WebSocket origins (hyphae connects via raw TCP, not WebSocket, but just in case)
    websockets:
        allowed-origins:
            - "https://chat.mycelium.social"
            - "https://mycelium.social"

    casemapping: "ascii"
    enforce-utf8: true
    lookup-hostnames: false
    forward-confirm-hostnames: true
    check-ident: false
    coerce-ident: '~u'

    motd: ircd.motd
    motd-formatting: true

    idle-timeouts:
        registration: 60s
        ping: 1m30s
        disconnect: 2m30s

    relaymsg:
        enabled: true
        separators: "/"
        available-to-chanops: true

    proxy-allowed-from:
        - localhost

    webirc: []

    max-sendq: 96k

    compatibility:
        force-trailing: true
        send-unprefixed-sasl: true
        allow-truncation: false

    ip-limits:
        count: true
        max-concurrent-connections: 16
        throttle: true
        window: 10m
        max-connections-per-window: 32
        cidr-len-ipv4: 32
        cidr-len-ipv6: 64
        exempted:
            - "localhost"

    ip-cloaking:
        enabled: true
        enabled-for-always-on: true
        netname: "mycelium"
        cidr-len-ipv4: 32
        cidr-len-ipv6: 64
        num-bits: 64
        nostr-hostnames: true

    secure-nets: []

    oper-throttle: 10s

    override-services-hostname: "mycelium.social"

    suppress-lusers: false

accounts:
    authentication-enabled: true

    registration:
        enabled: true
        throttling:
            enabled: true
            duration: 10m
            max-attempts: 30
        bcrypt-cost: 4
        verify-timeout: "32h"
        email-verification:
            enabled: false
        nostr-verification:
            enabled: true
            # PLACEHOLDER — configure.sh will write the real key
            private-key: ""
            default-relays:
                - "wss://relay.damus.io"
                - "wss://nos.lol"
                - "wss://profiles.nostr1.com"
            timeout: 30s

    login-throttling:
        enabled: true
        duration: 1m
        max-attempts: 3

    skip-server-password: false
    login-via-pass-command: true
    advertise-scram: true

    require-sasl:
        enabled: false
        exempted:
            - "localhost"

    nick-reservation:
        enabled: true
        additional-nick-limit: 2
        method: strict

    multiclient:
        enabled: true
        allowed-by-default: true
        always-on: "opt-in"
        auto-away: "opt-in"
        always-on-expiration: 90d

# Channel naming convention:
#   #lobby              — public lobby, auto-joined by all users
#   #live-<stream>      — per-stream chat (created/destroyed by live.mycelium.social)
#   #relay-<domain>     — per-relay chat for NIP-42 authenticated relay operators
#   #<custom>           — user-created channels
channels:
    default-modes: +ntC
    max-channels-per-client: 100
    operator-only-creation: false
    registration:
        enabled: true
        operator-only: false
        max-channels-per-account: 25
    list-delay: 0s
    invite-expiration: 24h
    auto-join:
        - "#lobby"

oper-classes:
    "chat-moderator":
        title: Chat Moderator
        capabilities:
            - "kill"
            - "ban"
            - "nofakelag"
            - "relaymsg"
            - "vhosts"
            - "sajoin"
            - "samode"
            - "snomasks"
            - "roleplay"
    "server-admin":
        title: Server Admin
        extends: "chat-moderator"
        capabilities:
            - "rehash"
            - "accreg"
            - "chanreg"
            - "history"
            - "defcon"
            - "massmessage"
            - "metadata"

opers:
    admin:
        class: "server-admin"
        hidden: true
        whois-line: is the server administrator
        # PLACEHOLDER — generate with: ergo genpasswd
        password: "$2a$04$0123456789abcdef0123456789abcdef0123456789abcdef01234"

logging:
    -
        method: stderr
        type: "* -userinput -useroutput"
        level: info

debug:
    recover-from-errors: true

lock-file: "ircd.lock"

datastore:
    path: ircd.db
    autoupgrade: true
    mysql:
        enabled: false

languages:
    enabled: true
    default: en
    path: languages

limits:
    nicklen: 32
    identlen: 20
    realnamelen: 150
    channellen: 64
    awaylen: 390
    kicklen: 390
    topiclen: 390
    monitor-entries: 100
    whowas-entries: 100
    chan-list-modes: 100
    registration-messages: 1024
    multiline:
        max-bytes: 4096
        max-lines: 100

fakelag:
    enabled: true
    window: 1s
    burst-limit: 5
    messages-per-window: 2
    cooldown: 2s
    command-budgets:
        "CHATHISTORY": 16
        "MARKREAD": 16
        "MONITOR": 1
        "WHO": 4
        "WEBPUSH": 1

roleplay:
    enabled: false

history:
    enabled: true
    channel-length: 2048
    client-length: 256
    autoresize-window: 3d
    autoreplay-on-join: 0
    chathistory-maxmessages: 1000
    znc-maxmessages: 2048
    restrictions:
        expire-time: 1w
        query-cutoff: "none"
        grace-period: 1h
    retention:
        allow-individual-delete: false
        enable-account-indexing: false
    tagmsg-storage:
        default: false
        whitelist:
            - "+draft/react"
            - "+react"
