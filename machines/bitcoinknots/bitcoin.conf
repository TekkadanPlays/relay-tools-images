# Bitcoin Knots v29.3 — BIP-110 compliant configuration
# This file is a template; configure.sh will generate the actual config
# with randomized RPC credentials at deploy time.

# Network
server=1
listen=1
prune=550

# RPC — credentials are generated by configure.sh
rpcuser=PLACEHOLDER_USER
rpcpassword=PLACEHOLDER_PASS
rpcallowip=127.0.0.1
rpcallowip=10.0.0.0/8
rpcbind=0.0.0.0
rpcport=8332

# BIP-110 policy defaults (enforced by Knots v29.3)
datacarriersize=42
permitbaremultisig=0

# Performance
dbcache=450
maxmempool=300
maxconnections=40

# Logging
printtoconsole=0
debuglogfile=/home/bitcoin/.bitcoin/debug.log
