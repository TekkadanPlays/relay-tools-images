# KeyDB configuration for CoinOS
# Redis-compatible, used as primary datastore

bind 0.0.0.0
port 6379
protected-mode no

# Persistence
dir /home/keydb/data
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel notice
logfile /home/keydb/data/keydb.log

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300
